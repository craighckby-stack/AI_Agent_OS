name: Release

# ARCHITECTURAL HEADER:
# This workflow manages the release lifecycle for Tessera Enterprise.
# It enforces 'Diagnostic Integrity' by requiring a successful system health
# check before proceeding to build and publication, ensuring zero-leak
# and consensus-validated releases.
# Integration: Connects to lib/diagnostic-engine.ts and diagnostic_engine.py.

on:
  push:
    tags:
      - "v*"

jobs:
  diagnostic-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Integrity Gate
        run: |
          chmod +x .github/scripts/integrity-check.sh
          ./.github/scripts/integrity-check.sh

      - name: Run Diagnostic Engine (Python)
        run: |
          python -c "from diagnostic_engine import run_system_diagnostics; import sys; res = run_system_diagnostics(); print(res); sys.exit(0 if res['status'] == 'HEALTHY' else 1)"

  release:
    needs: diagnostic-check
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # for PyPI trusted publishing
      contents: write  # for GitHub Releases

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz